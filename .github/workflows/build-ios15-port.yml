name: Build Husk iOS 15 IPA
on:
  workflow_dispatch:
  push:
    paths:
      - husk-ios15.patch
      - .github/workflows/build-ios15-port.yml
permissions:
  contents: read
concurrency:
  group: husk-ios15-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 360
    env:
      SDKMINVER: "15.6"
      DD: /tmp/husk_ios15
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned Husk with the iOS 15 port
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/Leviidev/Husk.git husk
          git -C husk checkout 6b59e21dbe6ac7013f237c149f995c231a05900b
          git -C husk apply --check ../husk-ios15.patch
          git -C husk apply ../husk-ios15.patch
          shasum -a 256 husk-ios15.patch
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu e2fsprogs
          python3 -m venv /tmp/husk-build-python
          /tmp/husk-build-python/bin/python -m pip install 'PyYAML==6.0.3' 'Mako==1.3.10'
          echo /tmp/husk-build-python/bin >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test bundle compatibility gate
        working-directory: husk
        run: python3 -m unittest discover -s tests -p 'test_ios15_*.py' -v
      - name: Restore dependency build cache
        uses: actions/cache/restore@v4
        with:
          key: husk-ios156-deps-v1-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: husk-ios156-deps-v1-${{ runner.arch }}-
          path: |
            husk/build/ios-arm64
            husk/build/android-source
            husk/build/r8-8.5.35.jar
            husk/build/stamps
            husk/third_party
            husk/guests
            husk/src/rppairing-ios/target
      - name: Compile dependencies and package IPA
        working-directory: husk
        run: |
          set -o pipefail
          mkdir -p build/logs
          if ! ./scripts/ci_build.sh "$PWD/build/Husk-iOS15.ipa" 2>&1 | tee build/logs/ci.log; then
            for log in build/logs/*.log /tmp/husk_ios15/build.log; do
              [ -f "$log" ] || continue
              echo "::group::$log"
              tail -n 80 "$log"
              echo "::endgroup::"
            done
            exit 1
          fi
          shasum -a 256 build/*.ipa build/*.tipa > build/SHA256SUMS.txt
      - name: Preserve packages and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS15-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            husk/build/*.ipa
            husk/build/*.tipa
            husk/build/SHA256SUMS.txt
            husk/build/logs/
            /tmp/husk_ios15/build.log
            husk-ios15.patch
      - name: Save dependency progress for the next build
        if: always()
        uses: actions/cache/save@v4
        with:
          key: husk-ios156-deps-v1-${{ runner.arch }}-${{ github.run_id }}
          path: |
            husk/build/ios-arm64
            husk/build/android-source
            husk/build/r8-8.5.35.jar
            husk/build/stamps
            husk/third_party
            husk/guests
            husk/src/rppairing-ios/target
