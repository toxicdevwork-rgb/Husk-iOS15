          +"Accent Colour" = "Цвет акцента";
          +"Add" = "Добавить";
          +"Add Download" = "Добавить загрузку";
          +"Add a Game or App" = "Добавить игру или приложение";
          +"Add to Husk" = "Добавить в Husk";
