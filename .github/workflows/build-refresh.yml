          +"Android Libraries Used" = "Используемые библиотеки Android";
          +"Android and Translation Layer need JIT. On iOS 15, use TrollStore or Dopamine with Allow JIT in Apps enabled." = "Для Android и трансляции нужен JIT. На iOS 15 используйте TrollStore или Dopamine с включённой настройкой Allow JIT in Apps.";
