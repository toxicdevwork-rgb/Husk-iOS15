          +"Apps and games open in a window you can move, resize and minimise to a dock, like LiveContainer's multitasking. Each app can override this in its own settings." = "Приложение откроется в окне, которое можно перемещать, менять в размере и сворачивать. Режим можно изменить отдельно в настройках каждого приложения.";
          +"The list is written to disk, so it is on screen before Android has finished starting." = "Список хранится на устройстве и доступен ещё до завершения загрузки Android.";
          +"Names and icons come from Android's own launcher, which keeps the version it draws. Re-fetching throws away Husk's copies and asks again." = "Названия и значки поступают из Android. Повторная загрузка заменяет их копии в Husk.";
          +"Adds a sound device. While it is attached Android cannot be saved — QEMU refuses to snapshot a machine with one — so every launch boots from cold. Turning it on or off costs a cold boot either way." = "Подключает звуковое устройство. QEMU не сохраняет снимки машины с этим устройством, поэтому Android каждый раз загружается с нуля. Смена этой настройки также требует полной загрузки.";
          +"The panel is built when the machine starts, so a change costs one cold boot, and the next save replaces the machine saved at the old size — changing back costs another. Sizes are rounded to a multiple of eight. Bigger is slower: every pixel is drawn by an emulated phone. Android's density does not change with the panel, so a larger one shows more rather than bigger." = "Смена разрешения требует полной загрузки Android. Новый снимок заменит сохранённую машину со старым размером экрана. Размеры округляются до кратных восьми. Большое разрешение снижает скорость и позволяет разместить больше элементов.";
          +"Touch is always on. The keyboard and the rotate control are in the pill at the bottom of the guest's screen; a gamepad and a pointer are not wired through yet." = "Касания работают всегда. Клавиатура и поворот доступны в панели внизу экрана Android. Передача геймпада и мыши пока не реализована.";
          +"Android reaches the internet through a virtual ethernet card on QEMU's own network. Nothing on your phone's network can see the guest, and the guest cannot see it." = "Android подключается к интернету через виртуальную сетевую карту QEMU. Входящие подключения ограничены настройками виртуальной сети.";
          +"Husk needs memory it can write and then execute, which on iOS takes an attached debugger. There are two ways to get it: a debugger that services trap requests, or a MAP_JIT mapping, which the kernel allows any debugged process. Either one is enough — which is available depends on the device and the iOS version, so Husk tests both rather than assuming." = "Для JIT нужна память, в которую можно записывать и затем выполнять код. На iOS 15 Husk проверяет доступные способы выделения такой памяти. Используйте TrollStore или Dopamine с включённой настройкой Allow JIT in Apps.";
          +"Off by default. Husk detaches StikDebug as soon as the JIT region is held, because a debugger that iOS has suspended stops the whole app the next time it is needed. Turn this on only to collect StikDebug's own logs." = "По умолчанию выключено. Отладчик отключается после выделения памяти JIT. Эта настройка нужна для сбора журналов StikDebug на поддерживаемых версиях iOS; на iOS 15 StikDebug недоступен.";
          +"APKs install from the Library's + button or from the Files tab. Split sets — a base APK plus its config pieces — must be picked together; installing the base alone fails on missing native libraries." = "Установить APK можно кнопкой «+» в библиотеке или через вкладку «Файлы». Для split APK выбирайте основной пакет и все его части вместе, иначе приложению будет не хватать библиотек.";
          +"Husk restores a saved machine instead of booting it, which takes seconds rather than minutes. The picture freezes while it writes. With this off, nothing saves by itself — including after an install." = "Husk восстанавливает сохранённую машину вместо полной загрузки. Во время сохранения изображение замирает. Если автосохранение выключено, состояние нужно сохранять вручную, в том числе после установки приложений.";
          +"Adds about 2 GB to the first download. It was captured on the software renderer, so it is not used on GPU — which cold-boots once and then saves its own." = "Дополнительно скачивает около 2 ГБ. Снимок создан с программной графикой и требует совместимой конфигурации памяти. Режим GPU начинает загрузку с нуля и сохраняет собственный снимок.";
          +"When a new Android image or snapshot is published, Husk asks once whether to download it. Never asked before Android has been downloaded." = "Когда выходит новый образ Android или снимок, Husk предлагает его скачать. Предложения появятся только после первой установки Android.";
          +"System follows the phone: light by day, dark by night. The guest's own screen stays dark either way — it is a picture of another phone." = "Системная тема повторяет оформление iPhone. Эта настройка меняет интерфейс Husk, но не тему внутри Android.";
          +"Automatic follows the system appearance — light, dark and tinted. The others pin one look. iOS shows its own confirmation after a change; that alert cannot be turned off." = "Автоматический режим следует оформлению системы. Остальные варианты фиксируют вид значка. После смены значка iOS показывает своё подтверждение.";
          +"Technical detail in the Android Translation Layer screens: library reports, device checks and run logs." = "Технические сведения на экранах трансляции: отчёты о библиотеках, проверки устройства и журналы запуска.";
          +"Husk runs unmodified Android APKs in a real Android system on your iPhone. The console shows Husk's live log, the guest's serial output and QEMU's own output — the three files any problem here is diagnosed from." = "Husk запускает Android-приложения через трансляцию или эмуляцию Android. Совместимость зависит от приложения и устройства. В консоли доступны журналы Husk, Android и QEMU для диагностики.";
          +"This installation can only wait about 30 seconds in the background, so go to Settings straight away." = "В фоне эта установка может ждать около 30 секунд. Сразу перейдите в настройки.";
          +"Pick an APK or a bundle (.xapk, .apkm, .apks), or share one to Husk from Files or Safari. Games run straight on your iPhone. Other apps run inside Android." = "Выберите APK или набор пакетов (.xapk, .apkm, .apks), либо отправьте его в Husk из «Файлов» или Safari. Доступны трансляция и запуск внутри Android; совместимость зависит от приложения.";
          +"Husk runs a real Android system and opens APKs inside it. A few questions first — all of them can be changed later in Settings." = "Husk запускает Android и поддерживаемые APK. Сначала выберите основные настройки — их можно изменить позже.";
          +"Android and Translation Layer games need JIT, which on iOS only an attached debugger can grant. StikJIT is built into Husk and is the recommended way: it turns JIT on from inside the app, with no computer and no other app. StikDebug and TrollStore work too." = "Для Android и трансляции нужен JIT. В этой сборке для iOS 15 используйте TrollStore или Dopamine с включённой настройкой Allow JIT in Apps. Встроенное сопряжение и StikDebug на iOS 15 недоступны.";
          +"If JIT is not on when Android starts, Husk turns it on with the method you chose, or walks you through setting one up. You can change it any time in Settings › JIT & sideload." = "Если JIT недоступен, Husk предложит его настроить. Выбор можно изменить в разделе «Настройки → JIT и установка приложений».";
          +"JIT was already on when Husk opened." = "JIT уже был включён при открытии Husk.";
          +"A jailbreak was found. Turn on Allow JIT in Apps." = "Обнаружен джейлбрейк. Включите Allow JIT in Apps в Dopamine.";
          +"Dopamine can give every app JIT with one setting." = "Dopamine позволяет включить JIT настройкой Allow JIT in Apps.";
          +"For a Husk installed through TrollStore." = "Для Husk, установленного через TrollStore.";
          +"Import a pairing file made on a computer." = "Импортировать файл сопряжения, созданный на компьютере.";
          +"With icons" = "Со значками";
          +"Pair on this device" = "Сопряжение на этом устройстве";
          +"On a device jailbroken with Dopamine, JIT is a setting: the jailbreak marks every app as debugged when it opens, and a debugged app may run code it wrote. Husk needs nothing else." = "В Dopamine JIT включается настройкой Allow JIT in Apps. Права применяются при запуске приложения, поэтому после изменения настройки нужно полностью перезапустить Husk.";
          +"Open Dopamine and go to its Settings." = "Откройте Dopamine и перейдите в его настройки.";
          +"Turn on Allow JIT in Apps." = "Включите Allow JIT in Apps (разрешить JIT в приложениях).";
          +"Close Husk completely and open it again. The setting applies to apps as they start." = "Полностью закройте Husk и откройте снова. Настройка применяется при запуске приложений.";
          +"TrollStore can enable JIT for apps it installed, with no pairing file, VPN or computer." = "TrollStore может включать JIT для установленных через него приложений без файла сопряжения, VPN или компьютера.";
          +"Install Husk.ipa through TrollStore, on an iOS version TrollStore supports. It carries the entitlements TrollStore keeps, so the same file works there and in a sideloader." = "Установите Husk-iOS15.tipa через TrollStore на поддерживаемой версии iOS. Этот пакет подготовлен для установки через TrollStore.";
          +"In TrollStore's Settings, turn on URL Scheme. TrollStore ignores enable-jit requests without it." = "В настройках TrollStore включите URL Scheme. Без этой настройки TrollStore игнорирует запросы на включение JIT.";
          +"Whenever Android or a game starts, Husk asks TrollStore to enable JIT. TrollStore opens Husk, attaches to it for a moment and lets go, which leaves it allowed to run code it wrote." = "При запуске Android или приложения Husk запрашивает включение JIT через TrollStore. Краткое подключение отладчика даёт Husk право выполнять сгенерированный код.";
          +
          +"The app crashed" = "Приложение завершилось с ошибкой";
          +"Its code stopped with %@" = "Ошибка выполнения: %@";
          diff --git a/src/java-framework/src/android/graphics/Bitmap.java b/src/java-framework/src/android/graphics/Bitmap.java
          index 2036fee..00df052 100644
          --- a/src/java-framework/src/android/graphics/Bitmap.java
          +++ b/src/java-framework/src/android/graphics/Bitmap.java
          @@ -18,12 +18,13 @@ public final class Bitmap implements android.os.Parcelable {
           
               private long mNative;
               private int mWidth, mHeight;
          +    private int mAllocationBytes;
               private Config mConfig;
               private boolean mMutable, mRecycled, mHasAlpha = true, mPremultiplied = true;
               private int mDensity = android.util.DisplayMetrics.DENSITY_DEVICE_STABLE;
               private int mGeneration;
           
          -    Bitmap(long nat, int w, int h, Config c, boolean mutable) { mNative = nat; mWidth = w; mHeight = h; mConfig = c == null ? Config.ARGB_8888 : c; mMutable = mutable; }
          +    Bitmap(long nat, int w, int h, Config c, boolean mutable) { mNative = nat; mWidth = w; mHeight = h; mAllocationBytes = w * h * 4; mConfig = c == null ? Config.ARGB_8888 : c; mMutable = mutable; }
               /** The native bitmap. */
               public long huskNative() { return mNative; }
               /** Changes each time it is drawn into, for caches. */
