          PATCH
          git -C husk apply ../refresh.patch
      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu e2fsprogs
          python3 -m venv /tmp/husk-build-python
          /tmp/husk-build-python/bin/python -m pip install 'PyYAML==6.0.3' 'Mako==1.3.10'
          echo /tmp/husk-build-python/bin >> "$GITHUB_PATH"
          rustup target add aarch64-apple-ios
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore dependency build cache
        uses: actions/cache/restore@v4
        with:
          key: husk-refresh-d92d0a1-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: husk-refresh-d92d0a1-${{ runner.arch }}-
          path: |
            husk/build/ios-arm64
            husk/build/stamps
            husk/third_party
            husk/guests
            husk/src/rppairing-ios/target
      - name: Restore Android source resources
        uses: actions/cache@v4
        with:
          key: husk-android-resources-v1-a8dbaecc8f
          path: |
            husk/build/android-source
            husk/build/r8-8.5.35.jar
      - name: Compile dependencies and package IPA
        working-directory: husk
        run: |
          set -o pipefail
          HUSK_JDK="$JAVA_HOME" python3 scripts/prepare_android_runtime.py
          mkdir -p build/logs
          if ! ./scripts/ci_build.sh "$PWD/build/Husk-iOS15.ipa" 2>&1 | tee build/logs/ci.log; then
            for log in build/logs/epoxy.log build/logs/virgl.log /tmp/husk_ios15/build.log; do
              [ -f "$log" ] || continue
              echo "::group::$log"
              tail -n 80 "$log"
              echo "::endgroup::"
            done
            exit 1
          fi
          shasum -a 256 build/*.ipa build/*.tipa > build/SHA256SUMS.txt
      - name: Preserve packages and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-iOS15-refresh-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            husk/build/*.ipa
            husk/build/*.tipa
            husk/build/SHA256SUMS.txt
            husk/build/logs/
            /tmp/husk_ios15/build.log
            refresh.patch
      - name: Save dependency progress for the next build
        if: always()
        uses: actions/cache/save@v4
        with:
          key: husk-refresh-d92d0a1-${{ runner.arch }}-${{ github.run_id }}
          path: |
            husk/build/ios-arm64
            husk/build/stamps
            husk/third_party
            husk/guests
            husk/src/rppairing-ios/target
