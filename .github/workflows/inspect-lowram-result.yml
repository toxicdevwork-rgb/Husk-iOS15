name: Inspect low-RAM Android result
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/inspect-lowram-result.yml]
  workflow_run:
    workflows: [Test Android with 1 GiB guest RAM]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || '38169714066' }}
          pattern: Android-1GiB-experiment-*
          path: evidence
          merge-multiple: true
      - name: Show guest diagnostics and boot gate result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          summary=[]
          for p in sorted(Path('evidence').rglob('*')):
              if p.is_file() and p.suffix in ('.txt', '.json', '.log'):
                  print('FILE', p.name)
                  full=p.read_text(errors='replace')
                  if p.name == 'serial.log':
                      key=re.compile(r'out of memory|lowmemorykiller|lmkd|watchdog|boot_completed|husk_agent|fatal|zygote.*(?:exited|signal)|system_server.*(?:exited|signal)|husk_lowram_logcat|RescueParty|AndroidRuntime|Exception|Caused by|Abort message|Fatal signal|Process:', re.I)
                      selected='\n'.join(line for line in full.splitlines() if key.search(line))[-18000:]
                      summary.append('### Boot and failure signals\n\n```text\n'+selected.replace('```','~~~')+'\n```\n')
                  content=full[-18000:]
                  print(content)
                  summary.append('### '+p.name+'\n\n```text\n'+content.replace('```','~~~')+'\n```\n')
          assert summary, 'No evidence files were downloaded'
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(summary))
          PY
